name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Validate release version and URL
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('module.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const expectedArchive = `rn-playlist-companion-${tag}.zip`;
          if (tag !== `v${manifest.version}`) {
            throw new Error(`Tag ${tag} does not match module version ${manifest.version}`);
          }
          if (!manifest.download.endsWith(`/releases/download/${tag}/${expectedArchive}`)) {
            throw new Error(`Download URL must end with /releases/download/${tag}/${expectedArchive}`);
          }
          NODE

      - name: Build Foundry package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package
          cp module.json README.md LICENSE dist/package/
          cp -R scripts styles lang dist/package/
          cp module.json dist/module.json
          (cd dist/package && zip -q -r "../rn-playlist-companion-${RELEASE_TAG}.zip" .)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/rn-playlist-companion-${RELEASE_TAG}.zip" \
            dist/module.json \
            --clobber

      - name: Publish version to Foundry
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const token = process.env.FOUNDRY_RELEASE_TOKEN;
          if (!token) throw new Error('FOUNDRY_RELEASE_TOKEN repository secret is missing');

          const manifest = JSON.parse(readFileSync('module.json', 'utf8'));
          const releaseUrl = `https://github.com/${process.env.REPOSITORY}/releases`;
          const body = {
            id: manifest.id,
            release: {
              version: manifest.version,
              manifest: `${releaseUrl}/download/${process.env.RELEASE_TAG}/module.json`,
              notes: `${releaseUrl}/tag/${process.env.RELEASE_TAG}`,
              compatibility: manifest.compatibility,
            },
          };

          for (const dryRun of [true, false]) {
            const response = await fetch('https://foundryvtt.com/_api/packages/release_version/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: token,
              },
              body: JSON.stringify(dryRun ? { ...body, 'dry-run': true } : body),
            });
            const result = await response.text();
            if (!response.ok) {
              throw new Error(`Foundry ${dryRun ? 'validation' : 'publication'} failed (${response.status}): ${result}`);
            }
            console.log(`Foundry ${dryRun ? 'validation' : 'publication'} succeeded`);
          }
          NODE
